name: CI

on:
  push:
  pull_request:

jobs:
  powershell-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "Parse errors in $($f.FullName)"
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }
      - name: Run Pester smoke tests
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          if (Test-Path ./tests) { Invoke-Pester -Path ./tests -CI }